<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal Virtual de Pagos</title>
  
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://sdk.mercadopago.com/js/v2"></script>
  <script src="https://www.mercadopago.com/v2/security.js" view="checkout" output="mpDeviceId"></script>
</head>
<body>
  <div class="app-container" id="app-container">
    
    <!-- PANTALLA 1: INTERFAZ DE RELLENO (Premium Dark Theme) -->
    <div class="payment-card" id="step-1-container">
      <div class="header" style="display: flex; flex-direction: column; align-items: center; margin-bottom: 2rem;">
        <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <h2 class="title" style="margin: 0; background: linear-gradient(135deg, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Terminal Pay</h2>
        </div>
        <p class="subtitle" style="margin: 0;">Ingresa el monto y concepto a cobrar</p>
      </div>

      <div class="card-visual-wrapper">
         <div class="virtual-card">
            <div class="card-chip"></div>
            <div class="card-wifi"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" x2="12.01" y1="20" y2="20"/></svg></div>
         </div>
      </div>

      <form id="details-form">
        <div class="input-group">
          <label for="amount">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            Monto a cobrar (MXN)
          </label>
          <input type="number" id="amount" required placeholder="Ej. 1500.00" min="1" step="0.01">
        </div>
        
        <div class="input-group">
          <label for="description">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            Concepto / Descripción
          </label>
          <input type="text" id="description" required placeholder="Ej. Servicio de Consultoría">
        </div>

        <div style="margin-top: 2rem;">
          <button type="submit" class="glow-effect">
            Continuar al Pago
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </button>
        </div>
      </form>
    </div>

    <!-- PANTALLA 2: CAPTURA DE TARJETA E IDENTIDAD -->
    <div class="payment-card hidden" id="step-2-container">
      
      <div class="header-top" style="display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem;">
        <button type="button" id="btn-back" class="btn-back" title="Volver a los detalles">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <h2 class="title" style="margin: 0; font-size: 1.25rem;">Pago Seguro</h2>
      </div>
      <p class="subtitle" style="margin-left: 2.5rem;">Captura la tarjeta en el formulario seguro de Mercado Pago. No guardamos número de tarjeta ni CVV.</p>

      <div class="card-brands-header" style="margin-left: 2.5rem;">
        <h3 style="font-size: 1rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-primary);">Tarjeta de crédito o débito</h3>
        <div class="brands-icons" style="display: flex; gap: 0.5rem;">
          <div class="brand-box visa" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff;">VISA</div>
          <div class="brand-box mastercard" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);"><div class="circle red"></div><div class="circle orange"></div></div>
          <div class="brand-box amex" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff;">AMEX</div>
        </div>
      </div>

      <form id="checkout-form" class="checkout-form" style="margin-top: 1.5rem;">
        <div class="input-group">
          <label>Número de tarjeta</label>
          <div id="cardNumber" class="secure-field"></div>
        </div>
        
        <div class="input-group">
          <label>Vencimiento</label>
          <div id="expirationDate" class="secure-field"></div>
        </div>
        
        <div class="input-group">
          <label>Código de seguridad</label>
          <div class="secure-wrapper">
            <div id="securityCode" class="secure-field"></div>
            <div class="cvv-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.5;"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>
            </div>
          </div>
        </div>

        <div class="input-group" style="margin-top: 1rem;">
          <label for="cardholderName">Nombre del titular como aparece en la tarjeta</label>
          <input type="text" id="cardholderName" required placeholder="María Clara López Roldán">
        </div>
        
        <div class="input-group" style="margin-top: 1rem;">
          <label for="payerEmail">Completa tu información <br><span class="label-subtitle" style="font-weight: 400; color: var(--text-secondary); font-size: 0.8rem;">E-mail</span></label>
          <input type="email" id="payerEmail" required placeholder="ejemplo@email.com">
        </div>

        <div style="margin-top: 2.5rem;">
          <button type="submit" id="btn-pay" class="glow-effect">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Pagar
          </button>
        </div>
      </form>
    </div>

    <!-- PANTALLA 3: SUCCESS -->
    <div id="success-screen" class="payment-card hidden success-screen">
      <div class="success-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      </div>
      <h3>¡Pago Procesado!</h3>
      <p style="color: var(--text-secondary); margin-bottom: 2rem;">La transacción ha sido aprobada exitosamente.</p>
      <button id="btn-new-payment" class="btn-secondary">Nuevo Cobro</button>
    </div>
  </div>
  
  <script src="app.js"></script>
</body>
</html>
